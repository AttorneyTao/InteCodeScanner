<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>ClearlyDefined CSV Enricher</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="py-5">
<div class="container">
  <h2 class="mb-4">Upload coordinate CSV</h2>
  <p class="text-muted">Required columns:
    <code>type, provider, namespace, name, revision, pr</code></p>

  <form id="uploadForm" class="mb-3">
    <input class="form-control" type="file" name="file" accept=".csv" required>
    <button class="btn btn-primary mt-3">Enrich</button>
  </form>

  <div id="loader" class="text-center d-none">
    <div class="spinner-border" role="status"></div>
    <p class="mt-2">Processing…</p>
  </div>

  <div id="result" class="d-none">
    <a id="downloadLink" class="btn btn-success mb-3" download="enriched.csv">Download full CSV</a>
    <div id="tableWrap" class="table-responsive"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
