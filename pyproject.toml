[project]
name = "clearly"
version = "0.0.1"
description = "ClearlyDefined helper library"
readme = ""
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28",
  "pandas>=2.0"
]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

# Tell setuptools to package ONLY the "clearly" package
[tool.setuptools.packages.find]
where = ["."]
include = ["clearly"]
exclude = ["tests*"]
